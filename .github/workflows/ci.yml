name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...
      - name: Tests (race detector)
        run: go test -race -count=1 ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  web:
    name: Web client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - name: Unit tests (crypto, i18n)
        run: npm test
      - run: npm run build
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

  e2e:
    name: End-to-end (two browsers, chat + video call)
    runs-on: ubuntu-latest
    needs: [server, web]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build relay
        working-directory: server
        run: go build -o "$RUNNER_TEMP/doommsg-server" ./cmd/doommsg-server
      - name: Install web deps
        working-directory: web
        run: npm ci --ignore-scripts && npx playwright install --with-deps chromium
      - name: Build web
        working-directory: web
        run: npm run build
      - name: Playwright
        working-directory: web
        env:
          DOOMMSG_SERVER_BIN: ${{ runner.temp }}/doommsg-server
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: web/test-results
          retention-days: 7

  docker:
    name: Container images
    runs-on: ubuntu-latest
    needs: [server, web]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Build server image
        uses: docker/build-push-action@v7
        with:
          context: server
          push: false
          tags: doommsg-server:ci
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server
      - name: Build web image
        uses: docker/build-push-action@v7
        with:
          context: web
          push: false
          tags: doommsg-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
