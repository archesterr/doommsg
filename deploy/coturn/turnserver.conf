# coturn for DoomMsg calls. Only relays DTLS-SRTP it cannot decrypt.
# The realm and public IP are passed on the command line from .env, and the
# shared secret is appended to a copy of this file on a tmpfs at startup
# (see docker-compose.yml), so this file holds nothing sensitive.

listening-port=3478
# Enable turns: (TLS on 5349) by mounting a cert and uncommenting:
# tls-listening-port=5349
# cert=/certs/fullchain.pem
# pkey=/certs/privkey.pem
# no-tlsv1
# no-tlsv1_1

# Keep in sync with the published UDP range in docker-compose.yml.
min-port=49160
max-port=49200

fingerprint
use-auth-secret
no-cli
no-multicast-peers
no-software-attribute
stale-nonce=600

# Abuse limits.
user-quota=12
total-quota=1200
max-bps=4000000

# Never relay into private, loopback or link-local ranges: stops the TURN
# server from being used to reach internal services (SSRF).
#
# The one exception is coturn's own bridge address, which a peer's relayed
# address maps back to: without it, calls where both sides are relayed
# (e.g. both use "Always relay calls") never connect. The allow-list is
# checked first, so every other denied address stays denied. Keep in sync
# with the address pinned in docker-compose.yml.
allowed-peer-ip=172.30.0.10
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.88.99.0-192.88.99.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=224.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=64:ff9b::-64:ff9b::ffff:ffff
denied-peer-ip=::ffff:0.0.0.0-::ffff:255.255.255.255
denied-peer-ip=100::-100::ffff:ffff:ffff:ffff
denied-peer-ip=2001::-2001:1ff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=2002::-2002:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

log-file=stdout
simple-log
pidfile=/tmp/turnserver.pid
